<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#111">
<link rel="apple-touch-icon" href="icon.png">
<title>Cadence</title>
<style>
  :root { --bg:#111; --fg:#eee; --dim:#888; --accent:#e8b33a; --row:#1c1c1c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px -apple-system, system-ui, sans-serif;
         padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size:24px; margin:20px 0 4px; }
  .sub { color:var(--dim); font-size:14px; }
  a { color:var(--accent); }
  button { background:var(--row); color:var(--fg); border:0; border-radius:12px;
           font:inherit; font-size:18px; padding:14px 18px; }
  ul { list-style:none; margin:16px 0 0; padding:0; }
  li { background:var(--row); border-radius:10px; padding:14px; margin-bottom:6px; }
  li.bucket { display:flex; justify-content:space-between; align-items:center;
              font-size:22px; font-weight:600; padding:18px 16px; }
  li.bucket .count { color:var(--dim); font-size:14px; font-weight:400; }
  h2.group { font-size:15px; font-weight:600; color:var(--accent); text-transform:uppercase;
             letter-spacing:.06em; margin:22px 0 0; }
  h2.group + ul { margin-top:8px; }
  li.bucket.live { outline:2px solid var(--accent); }
  li.track .t { font-weight:500; }
  li.track .a { color:var(--dim); font-size:13px; margin-top:2px; }
  li.track.playing { outline:2px solid var(--accent); }
  .bpm { color:var(--accent); float:right; font-variant-numeric:tabular-nums; }
  .back { background:none; padding:16px 0 0; color:var(--accent); font-size:17px; }
  .controls { display:flex; gap:10px; margin-top:16px; }
  #play { background:var(--accent); color:#111; font-weight:700; flex:2; font-size:22px; padding:18px; }
  #shuffle { flex:1; white-space:nowrap; padding:14px 8px; }
  #shuffle.on { outline:2px solid var(--accent); color:var(--accent); }
  #now { margin-top:14px; min-height:1.3em; }
  progress { width:100%; height:4px; accent-color:var(--accent); }
  /* Now-playing bar: pinned to the bottom of every screen once something has played */
  body.has-mini { padding-bottom:calc(env(safe-area-inset-bottom) + 88px); }
  .mini { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; align-items:center; gap:12px;
          background:#000; border-top:1px solid #333;
          padding:10px 16px calc(env(safe-area-inset-bottom) + 10px); }
  .mini button { background:var(--accent); color:#111; font-weight:700; font-size:16px; padding:12px 0; width:76px; flex:none; }
  .mini #miniNext { background:var(--row); color:var(--fg); width:64px; }
  .mini span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer { color:var(--dim); font-size:13px; margin-top:28px; line-height:1.5; }
  details summary { cursor:pointer; }
  .hidden { display:none !important; }
  .modes { display:flex; gap:6px; margin-top:14px; }
  .modes button { flex:1; font-size:15px; padding:12px 6px; }
  .modes button.on { background:var(--accent); color:#111; font-weight:700; }
</style>
</head>
<body>

<!-- Home: one row per 5-spm bucket -->
<section id="home">
  <h1>Cadence</h1>
  <div class="sub">Pick your steps per minute.</div>
  <div class="modes" id="modes">
    <button data-mode="military">Military only</button>
    <button data-mode="both">Both</button>
    <button data-mode="music">Techno</button>
  </div>
  <div id="buckets"></div>
  <footer>
    <a href="https://github.com/mamerten/running-cadence">GitHub: running-cadence</a>
    <details><summary>Music credits</summary><div id="credits"></div></details>
  </footer>
</section>

<!-- Bucket: tracks in one range, Play/Pause + Shuffle only -->
<section id="bucket" class="hidden">
  <button class="back" onclick="location.hash=''">‹ All cadences</button>
  <h1 id="bTitle"></h1>
  <div id="bSub" class="sub"></div>
  <div class="controls">
    <button id="play">Play</button>
    <button id="shuffle" class="on">Shuffle: On</button>
  </div>
  <div id="now" class="sub"></div>
  <progress id="prog" value="0" max="1"></progress>
  <ul id="tracks"></ul>
</section>

<!-- Now playing: on every screen. Tap the text to jump to that cadence. -->
<div id="mini" class="mini hidden">
  <button id="miniPlay">Pause</button><button id="miniNext">Next</button><span id="miniNow" class="sub"></span>
</div>

<audio id="audio" preload="none" playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const SIZE = 5;

let tracks = [];
let viewBucket = null;              // bucket on screen
let queue = [], pos = -1;           // what's actually playing (may differ from screen)
let playingBucket = null;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let shuffle = true;                             // on at every visit; the button only changes it for now
let mode = store.get('mode', 'both');          // 'military' | 'both' | 'music'

// Tracks allowed by the home-screen selector.
const pool = () => tracks.filter(t => mode === 'both' || (t.kind === 'military') === (mode === 'military'));

const MAX_NUDGE = 0.04;              // tracks from nearby buckets may be sped up/slowed up to 4%

const bucketOf = t => t.bpm == null ? 'unsorted' : Math.floor(t.bpm / SIZE) * SIZE;
const label = b => b === 'unsorted' ? 'Unsorted' : `${b}–${b + SIZE - 1}`;
// Plain-language pace for each tens of spm (150s, 160s, ...).
const CATEGORY = { 150: 'Fast walk', 160: 'Slow run', 170: 'Fast', 180: 'Very fast' };
const category = b => b === 'unsorted' ? '' : CATEGORY[Math.floor(b / 10) * 10] || '';

// An entry is a track plus the speed to play it at. Native tracks play at 1.0;
// a track just outside the bucket is nudged to the nearest tempo inside it.
function inBucket(b) {
  if (b === 'unsorted') return pool().filter(t => t.bpm == null).map(t => entry(t, t.bpm));
  const native = [], nudged = [];
  for (const t of pool()) {
    if (t.bpm == null) continue;
    if (bucketOf(t) === b) { native.push(entry(t, t.bpm)); continue; }
    if (t.artist === 'Generated') continue;     // every bucket already has its own beats
    const target = Math.min(Math.max(t.bpm, b), b + SIZE - 1);
    if (Math.abs(target / t.bpm - 1) <= MAX_NUDGE) nudged.push(entry(t, target));
  }
  return [...native, ...nudged];
}

function entry(t, bpm) {
  const rate = t.bpm ? bpm / t.bpm : 1;
  const pct = Math.round((rate - 1) * 100);
  return {
    t, bpm, rate, key: `${t.src}@${bpm}`,
    title: t.title + (rate > 1 ? ' (faster)' : rate < 1 ? ' (slower)' : ''),
    note: rate === 1 ? '' : ` · ${pct > 0 ? '+' : ''}${pct}% from ${t.bpm}`,
  };
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- screens ----------

function renderHome() {
  for (const btn of $('modes').children) btn.classList.toggle('on', btn.dataset.mode === mode);
  const buckets = [...new Set(tracks.map(bucketOf))].sort((a, b) => (a === 'unsorted') - (b === 'unsorted') || a - b);
  // One heading per pace group (Fast walk, Slow run, ...) with its ranges underneath.
  const box = $('buckets');
  box.innerHTML = '';
  let ul = null, group = null;
  for (const b of buckets) {
    const list = inBucket(b);
    if (!list.length) continue;                 // nothing of this kind at this pace
    if (!ul || category(b) !== group) {
      group = category(b);
      const h = document.createElement('h2');
      h.className = 'group';
      h.textContent = group || 'Other';
      ul = document.createElement('ul');
      box.append(h, ul);
    }
    const n = list.filter(e => e.rate === 1).length, adj = list.length - n;
    const li = document.createElement('li');
    li.className = 'bucket' + (b === playingBucket ? ' live' : '');
    const parts = [n && `${n} track${n > 1 ? 's' : ''}`, adj && `${adj} adjusted`].filter(Boolean);
    li.innerHTML = `<span>${label(b)}</span><span class="count">${parts.join(' + ')}</span>`;
    li.onclick = () => { location.hash = `#/${b}`; };
    ul.appendChild(li);
  }
  $('credits').innerHTML = tracks.filter(t => t.license).map(t =>
    `<div>“${esc(t.title)}” – ${esc(t.artist)} · <a href="${esc(t.license_url || '#')}">${esc(t.license)}</a>` +
    (t.source_url ? ` · <a href="${esc(t.source_url)}">source</a>` : '') + '</div>').join('')
    || 'Beat tracks are generated for this app.';
  updateMini();
}

function renderBucket() {
  const list = inBucket(viewBucket);
  $('bTitle').textContent = `${label(viewBucket)} spm`;
  const adj = list.filter(e => e.rate !== 1).length;
  const n = list.length - adj;
  const counts = [n && `${n} track${n > 1 ? 's' : ''}`, adj && `${adj} sped up or slowed down (max 4%)`]
    .filter(Boolean).join(' + ');
  $('bSub').textContent = [category(viewBucket), counts].filter(Boolean).join(' · ');
  const ul = $('tracks');
  ul.innerHTML = '';
  const cur = pos >= 0 ? queue[pos].key : null;
  for (const e of list) {
    const li = document.createElement('li');
    li.className = 'track' + (e.key === cur ? ' playing' : '');
    li.innerHTML = `<span class="bpm"></span><div class="t"></div><div class="a"></div>`;
    li.querySelector('.bpm').textContent = e.bpm ?? '';
    li.querySelector('.t').textContent = e.title;
    li.querySelector('.a').textContent = e.t.artist + e.note;
    li.onclick = () => startBucket(viewBucket, e.key);
    ul.appendChild(li);
  }
  $('shuffle').classList.toggle('on', shuffle);
  $('shuffle').textContent = shuffle ? 'Shuffle: On' : 'Shuffle: Off';
  updateControls();
  updateMini();
}

function route() {
  const m = location.hash.match(/^#\/(\w+)$/);
  viewBucket = m ? (m[1] === 'unsorted' ? 'unsorted' : +m[1]) : null;
  $('home').classList.toggle('hidden', viewBucket !== null);
  $('bucket').classList.toggle('hidden', viewBucket === null);
  viewBucket === null ? renderHome() : renderBucket();
  window.scrollTo(0, 0);
}

// ---------- playback ----------

function startBucket(b, firstKey) {
  const list = inBucket(b);
  queue = shuffle ? shuffled(list) : list;
  if (firstKey) {
    const first = queue.find(e => e.key === firstKey);
    queue = [first, ...queue.filter(e => e !== first)];
  }
  playingBucket = b;
  playAt(0);
}

function playAt(i) {
  pos = i;
  const e = queue[pos];
  audio.src = e.t.src;
  // Speed nudge like a turntable: pitch moves with speed (under a semitone at 4%).
  // Safari's pitch-preserving stretch sounds warbly, so it stays off
  // (webkit prefix for older Safari).
  // defaultPlaybackRate survives the new src loading; playbackRate applies now.
  audio.preservesPitch = audio.webkitPreservesPitch = false;
  audio.defaultPlaybackRate = audio.playbackRate = e.rate;
  audio.loop = queue.length === 1;              // lone track just repeats
  audio.play();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: e.title, artist: `${e.t.artist} · ${e.bpm ?? '?'} spm`, album: `${label(playingBucket)} spm`,
      artwork: [{ src: 'icon.png', sizes: '512x512', type: 'image/png' }],
    });
  }
  viewBucket !== null ? renderBucket() : renderHome();
}

function next() {
  if (pos < 0) return;
  if (pos + 1 < queue.length) return playAt(pos + 1);
  startBucket(playingBucket);                   // wrap around (reshuffles)
}
audio.onended = next;

function updateControls() {
  const here = playingBucket === viewBucket && pos >= 0;
  $('play').textContent = here && !audio.paused ? 'Pause' : 'Play';
  $('now').textContent = here ? `Now: ${queue[pos].title} · ${queue[pos].t.artist}` : '';
}

function updateMini() {
  const on = pos >= 0;
  $('mini').classList.toggle('hidden', !on);
  if (on) {
    $('miniPlay').textContent = audio.paused ? 'Play' : 'Pause';
    $('miniNow').textContent = `${label(playingBucket)} spm · ${queue[pos].title}`;
  }
  document.body.classList.toggle('has-mini', on);
}

$('play').onclick = () => {
  if (playingBucket !== viewBucket || pos < 0) return startBucket(viewBucket);
  audio.paused ? audio.play() : audio.pause();
};
for (const btn of $('modes').children) {
  btn.onclick = () => { mode = btn.dataset.mode; store.set('mode', mode); renderHome(); };
}
$('miniPlay').onclick = () => { audio.paused ? audio.play() : audio.pause(); };
$('miniNext').onclick = next;
$('miniNow').onclick = () => { if (playingBucket !== null) location.hash = `#/${playingBucket}`; };
$('shuffle').onclick = () => {
  shuffle = !shuffle;
  if (playingBucket === viewBucket && pos >= 0) {   // reorder what's left, keep current song
    const cur = queue[pos], rest = inBucket(viewBucket).filter(e => e.key !== cur.key);
    queue = [cur, ...(shuffle ? shuffled(rest) : rest)];
    pos = 0;
  }
  renderBucket();
};

audio.onplay = audio.onpause = () => { updateControls(); updateMini(); };
audio.ontimeupdate = () => { if (audio.duration) $('prog').value = audio.currentTime / audio.duration; };

// iOS 17+: declare this as music playback (not ambient sound) so the
// ring/silent switch doesn't mute it and it keeps going when locked.
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', next);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

fetch('tracks.json', { cache: 'no-store' }).then(r => r.json()).then(data => {
  tracks = data;
  addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
