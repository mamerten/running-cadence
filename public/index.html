<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#111">
<link rel="apple-touch-icon" href="icon.png">
<title>Cadence</title>
<style>
  :root { --bg:#111; --fg:#eee; --dim:#888; --accent:#e8b33a; --row:#1c1c1c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px -apple-system, system-ui, sans-serif;
         padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size:24px; margin:20px 0 4px; }
  .sub { color:var(--dim); font-size:14px; }
  a { color:var(--accent); }
  button { background:var(--row); color:var(--fg); border:0; border-radius:12px;
           font:inherit; font-size:18px; padding:14px 18px; }
  ul { list-style:none; margin:16px 0 0; padding:0; }
  li { background:var(--row); border-radius:10px; padding:14px; margin-bottom:6px; }
  li.bucket { display:flex; justify-content:space-between; align-items:center;
              font-size:22px; font-weight:600; padding:18px 16px; }
  li.bucket .count { color:var(--dim); font-size:14px; font-weight:400; }
  h2.group { font-size:15px; font-weight:600; color:var(--accent); text-transform:uppercase;
             letter-spacing:.06em; margin:22px 0 0; }
  h2.group + ul { margin-top:8px; }
  h2.group button { background:none; color:inherit; font:inherit; letter-spacing:inherit; min-height:44px;
                    text-transform:inherit; padding:4px 0; width:100%; text-align:left; }
  h2.group .arrow { display:inline-block; width:1.2em; }
  li.bucket.live { outline:2px solid var(--accent); }
  li.track { display:flex; gap:8px; align-items:center; padding:10px 6px 10px 14px; }
  li.track .info { flex:1; min-width:0; }
  li.track .t { font-weight:500; }
  li.track .a { color:var(--dim); font-size:13px; margin-top:2px; }
  li.track.playing { outline:2px solid var(--accent); }
  li.track.never { opacity:.45; }
  li.track .side { display:flex; flex-direction:column; align-items:flex-end; flex:none; }
  .bpm { color:var(--accent); font-variant-numeric:tabular-nums; padding-right:8px; }
  .marks { display:flex; }
  .marks button { background:none; color:var(--dim); font-size:20px; line-height:1; padding:8px; min-width:40px; }
  .marks .fav.on { color:var(--accent); }
  .marks .never.on { color:#e5534b; }
  #neverLink { display:block; margin-bottom:8px; }
  .back { background:none; padding:16px 0 0; color:var(--accent); font-size:17px; }
  .controls { display:flex; gap:10px; margin-top:16px; }
  #play { background:var(--accent); color:#111; font-weight:700; flex:2; font-size:22px; padding:18px; }
  #shuffle { flex:1; white-space:nowrap; padding:14px 8px; }
  #shuffle.on { outline:2px solid var(--accent); color:var(--accent); }
  #now { margin-top:14px; min-height:1.3em; }
  progress { width:100%; height:4px; accent-color:var(--accent); }
  /* Now-playing bar: pinned to the bottom of every screen once something has played */
  body.has-mini { padding-bottom:calc(env(safe-area-inset-bottom) + 88px); }
  .mini { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; align-items:center; gap:8px;
          background:#000; border-top:1px solid #333;
          padding:10px 16px calc(env(safe-area-inset-bottom) + 10px); }
  .mini button { background:var(--accent); color:#111; font-weight:700; font-size:16px; padding:12px 0; width:76px; flex:none; }
  .mini #miniFwd, .mini #miniNext { background:var(--row); color:var(--fg); width:58px; }
  .mini #miniPlay { width:70px; }
  .mini span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer { color:var(--dim); font-size:13px; margin-top:28px; line-height:1.5; }
  details summary { cursor:pointer; }
  .hidden { display:none !important; }
  .modes { display:flex; gap:6px; margin-top:14px; }
  .modes button { flex:1; font-size:15px; padding:12px 6px; }
  .modes button.on { background:var(--accent); color:#111; font-weight:700; }
</style>
</head>
<body>

<!-- Home: one row per 5-spm bucket -->
<section id="home">
  <h1>Cadence</h1>
  <div class="sub">Pick your steps per minute.</div>
  <div class="modes" id="modes">
    <button data-mode="military">Military only</button>
    <button data-mode="both">Both</button>
    <button data-mode="music">Techno</button>
  </div>
  <div class="modes" id="favModes">
    <button data-fav="first">♥ First</button>
    <button data-fav="only">♥ Only</button>
    <button data-fav="ignore">Ignore ♥</button>
  </div>
  <div id="buckets"></div>
  <footer>
    <a href="#/never" id="neverLink" class="hidden"></a>
    <a href="https://github.com/mamerten/running-cadence">GitHub: running-cadence</a>
    <details><summary>Music credits</summary><div id="credits"></div></details>
  </footer>
</section>

<!-- Bucket: tracks in one range, Play/Pause + Shuffle only -->
<section id="bucket" class="hidden">
  <button class="back" onclick="location.hash=''">‹ All cadences</button>
  <h1 id="bTitle"></h1>
  <div id="bSub" class="sub"></div>
  <div class="controls">
    <button id="play">Play</button>
    <button id="shuffle" class="on">Shuffle: On</button>
  </div>
  <div id="now" class="sub"></div>
  <progress id="prog" value="0" max="1"></progress>
  <ul id="tracks"></ul>
</section>

<!-- Never-play list: every track anyone marked ⊘, to review and later delete -->
<section id="never" class="hidden">
  <button class="back" onclick="location.hash=''">‹ All cadences</button>
  <h1>Never play</h1>
  <div class="sub">Skipped everywhere. Tap ⊘ to bring one back; ask to have the rest deleted for good.</div>
  <ul id="neverTracks"></ul>
</section>

<!-- Now playing: on every screen. Tap the text to jump to that cadence. -->
<div id="mini" class="mini hidden">
  <button id="miniPlay">Pause</button><button id="miniFwd" aria-label="Forward 15 seconds">+15</button><button id="miniNext">Next</button><span id="miniNow" class="sub"></span>
</div>

<audio id="audio" preload="none" playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const SIZE = 5;

let tracks = [];
let viewBucket = null;              // bucket on screen
let queue = [], pos = -1;           // what's actually playing (may differ from screen)
let playingBucket = null;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let shuffle = true;                             // on at every visit; the button only changes it for now
let mode = store.get('mode', 'both');          // 'military' | 'both' | 'music'
// 'first': favorites pinned and played first | 'only': just favorites | 'ignore': treated like any track
let favMode = store.get('favMode', 'first');

// Favorites / never-play, shared by everyone, kept on the server: { "<src>": "fav" | "never" }
let marks = {};
const isFav = t => marks[t.src] === 'fav';
const isNever = t => marks[t.src] === 'never';
async function setMark(t, mark) {
  marks = { ...marks };
  mark ? (marks[t.src] = mark) : delete marks[t.src];             // show it right away
  rerender();
  if (mark === 'never' && pos >= 0 && queue[pos].t === t) next(); // don't keep playing it
  try {
    const r = await fetch('api/marks', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ src: t.src, mark }) });
    if (r.ok) { marks = await r.json(); rerender(); }
  } catch {}
}

// Display order: favorites, then the rest, then never-play; each A–Z.
const byTitle = (a, b) => a.t.title.localeCompare(b.t.title, undefined, { numeric: true, sensitivity: 'base' });
const rank = e => isNever(e.t) ? 2 : isFav(e.t) && favMode !== 'ignore' ? 0 : 1;
const ordered = list => list.slice().sort((a, b) => rank(a) - rank(b) || byTitle(a, b));
const playable = list => list.filter(e => !isNever(e.t));

// What plays, in order: favorites first (each part shuffled if Shuffle is on).
function playOrder(list) {
  const mix = l => shuffle ? shuffled(l) : l;
  const ok = ordered(playable(list));
  if (favMode === 'ignore') return mix(ok);
  return [...mix(ok.filter(e => isFav(e.t))), ...mix(ok.filter(e => !isFav(e.t)))];
}

// Tracks allowed by the home-screen selector.
const pool = () => tracks.filter(t => mode === 'both' || (t.kind === 'military') === (mode === 'military'));

const MAX_NUDGE = 0.04;              // tracks from nearby buckets may be sped up/slowed up to 4%

const bucketOf = t => t.bpm == null ? 'unsorted' : Math.floor(t.bpm / SIZE) * SIZE;
const label = b => b === 'unsorted' ? 'Unsorted' : `${b}–${b + SIZE - 1}`;
// Plain-language pace for each tens of spm (150s, 160s, ...).
const CATEGORY = { 150: 'Fast walk', 160: 'Slow run', 170: 'Fast', 180: 'Very fast' };
// Pace groups folded on the home screen; tap a heading to open/close it.
const collapsed = new Set(['Marching', 'Fast walk']);
const category = b =>b === 'unsorted' ? '' : b < 150 ? 'Marching' : b >= 190 ? 'Very fast'
  : CATEGORY[Math.floor(b / 10) * 10];

// An entry is a track plus the speed to play it at. Native tracks play at 1.0;
// a track just outside the bucket is nudged to the nearest tempo inside it.
// "Favorites only" narrows every bucket to favorites. Returned in display order.
function inBucket(b) {
  const list = [];
  for (const t of pool()) {
    if (favMode === 'only' && !isFav(t)) continue;
    if (b === 'unsorted') { if (t.bpm == null) list.push(entry(t, t.bpm)); continue; }
    if (t.bpm == null) continue;
    if (bucketOf(t) === b) { list.push(entry(t, t.bpm)); continue; }
    if (t.artist === 'Generated') continue;     // every bucket already has its own beats
    const target = Math.min(Math.max(t.bpm, b), b + SIZE - 1);
    if (Math.abs(target / t.bpm - 1) <= MAX_NUDGE) list.push(entry(t, target));
  }
  return ordered(list);
}

function entry(t, bpm) {
  const rate = t.bpm ? bpm / t.bpm : 1;
  const pct = Math.round((rate - 1) * 100);
  return {
    t, bpm, rate, key: `${t.src}@${bpm}`,
    title: t.title + (rate > 1 ? ' (faster)' : rate < 1 ? ' (slower)' : ''),
    note: rate === 1 ? '' : ` · ${pct > 0 ? '+' : ''}${pct}% from ${t.bpm}`,
    length: t.seconds ? mmss(t.seconds / rate) : '',   // how long it plays at this speed
  };
}

const mmss = s => (s = Math.round(s), `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- screens ----------

function renderHome() {
  for (const btn of $('modes').children) btn.classList.toggle('on', btn.dataset.mode === mode);
  for (const btn of $('favModes').children) btn.classList.toggle('on', btn.dataset.fav === favMode);
  const nNever = tracks.filter(isNever).length;
  $('neverLink').textContent = `⊘ Never-play list (${nNever})`;
  $('neverLink').classList.toggle('hidden', !nNever);
  const buckets = [...new Set(tracks.map(bucketOf))].sort((a, b) => (a === 'unsorted') - (b === 'unsorted') || a - b);
  // One heading per pace group (Fast walk, Slow run, ...) with its ranges underneath.
  const box = $('buckets');
  box.innerHTML = '';
  if (favMode === 'only' && !pool().some(isFav))
    box.innerHTML = '<p class="sub">No favorites here yet. Switch to “♥ First”, open a range and tap ♡ on a track.</p>';
  let ul = null, group = null;
  for (const b of buckets) {
    const list = playable(inBucket(b));
    if (!list.length) continue;                 // nothing of this kind at this pace
    if (!ul || category(b) !== group) {
      group = category(b) || 'Other';
      const h = document.createElement('h2'), name = group, shut = collapsed.has(name);
      h.className = 'group';
      h.innerHTML = `<button><span class="arrow">${shut ? '▸' : '▾'}</span></button>`;
      h.firstChild.append(name);
      h.firstChild.onclick = () => { collapsed.has(name) ? collapsed.delete(name) : collapsed.add(name); renderHome(); };
      ul = document.createElement('ul');
      ul.classList.toggle('hidden', shut);
      box.append(h, ul);
    }
    const n = list.filter(e => e.rate === 1).length, adj = list.length - n;
    const li = document.createElement('li');
    li.className = 'bucket' + (b === playingBucket ? ' live' : '');
    const parts = [n && `${n} track${n > 1 ? 's' : ''}`, adj && `${adj} adjusted`].filter(Boolean);
    li.innerHTML = `<span>${label(b)}</span><span class="count">${parts.join(' + ')}</span>`;
    li.onclick = () => { location.hash = `#/${b}`; };
    ul.appendChild(li);
  }
  $('credits').innerHTML = tracks.filter(t => t.license).map(t =>
    `<div>“${esc(t.title)}” – ${esc(t.artist)} · <a href="${esc(t.license_url || '#')}">${esc(t.license)}</a>` +
    (t.source_url ? ` · <a href="${esc(t.source_url)}">source</a>` : '') + '</div>').join('')
    || 'Beat tracks are generated for this app.';
  updateMini();
}

// One track row: title + details, tempo, ♡ favorite and ⊘ never-play toggles.
function trackRow(e, onTap) {
  const li = document.createElement('li');
  li.className = 'track' + (pos >= 0 && e.key === queue[pos].key ? ' playing' : '') + (isNever(e.t) ? ' never' : '');
  li.innerHTML = `<div class="info"><div class="t"></div><div class="a"></div></div>
    <div class="side"><span class="bpm"></span><span class="marks">
      <button class="fav" aria-label="Favorite"></button><button class="never" aria-label="Never play">⊘</button></span></div>`;
  li.querySelector('.bpm').textContent = e.bpm ?? '';
  li.querySelector('.t').textContent = e.title;
  li.querySelector('.a').textContent = e.t.artist + (e.length && ` · ${e.length}`) + e.note;
  const fav = li.querySelector('.fav'), never = li.querySelector('.never');
  fav.textContent = isFav(e.t) ? '♥' : '♡';
  fav.classList.toggle('on', isFav(e.t));
  never.classList.toggle('on', isNever(e.t));
  fav.onclick = ev => { ev.stopPropagation(); setMark(e.t, isFav(e.t) ? null : 'fav'); };
  never.onclick = ev => {
    ev.stopPropagation();
    if (isNever(e.t)) return setMark(e.t, null);                  // bringing it back: no question
    if (confirm(`Never play “${e.t.title}”?\n\nIt'll be skipped everywhere, for everyone.`)) setMark(e.t, 'never');
  };
  if (onTap) li.onclick = onTap;
  return li;
}

function renderBucket() {
  const list = inBucket(viewBucket), ok = playable(list);
  $('bTitle').textContent = `${label(viewBucket)} spm`;
  const adj = ok.filter(e => e.rate !== 1).length;
  const n = ok.length - adj, skip = list.length - ok.length;
  const counts = [n && `${n} track${n > 1 ? 's' : ''}`, adj && `${adj} sped up or slowed down (max 4%)`]
    .filter(Boolean).join(' + ') + (skip ? ` · ${skip} never-play` : '');
  $('bSub').textContent = [category(viewBucket), counts].filter(Boolean).join(' · ');
  const ul = $('tracks');
  ul.innerHTML = '';
  for (const e of list) ul.appendChild(trackRow(e, () => startBucket(viewBucket, e.key)));
  $('shuffle').classList.toggle('on', shuffle);
  $('shuffle').textContent = shuffle ? 'Shuffle: On' : 'Shuffle: Off';
  updateControls();
  updateMini();
}

// Every never-play track (any mode), A–Z, to review before deleting for good.
function renderNever() {
  const ul = $('neverTracks');
  ul.innerHTML = '';
  for (const e of ordered(tracks.filter(isNever).map(t => entry(t, t.bpm)))) ul.appendChild(trackRow(e));
  if (!ul.children.length) ul.innerHTML = '<p class="sub">Nothing marked never-play.</p>';
  updateMini();
}

let neverView = false;
const rerender = () => neverView ? renderNever() : viewBucket !== null ? renderBucket() : renderHome();

function route() {
  const m = location.hash.match(/^#\/(\w+)$/);
  neverView = m?.[1] === 'never';
  viewBucket = !m || neverView ? null : (m[1] === 'unsorted' ? 'unsorted' : +m[1]);
  $('home').classList.toggle('hidden', !!m);
  $('bucket').classList.toggle('hidden', viewBucket === null);
  $('never').classList.toggle('hidden', !neverView);
  rerender();
  window.scrollTo(0, 0);
}

// ---------- playback ----------

// A tapped track plays first (even a never-play one, to hear it before deleting).
function startBucket(b, firstKey) {
  const list = inBucket(b);
  queue = playOrder(list);
  if (firstKey) queue = [list.find(e => e.key === firstKey), ...queue.filter(e => e.key !== firstKey)];
  if (!queue.length) return;
  playingBucket = b;
  playAt(0);
}

function playAt(i) {
  pos = i;
  const e = queue[pos];
  audio.src = e.t.src;
  // Speed nudge like a turntable: pitch moves with speed (under a semitone at 4%).
  // Safari's pitch-preserving stretch sounds warbly, so it stays off
  // (webkit prefix for older Safari).
  // defaultPlaybackRate survives the new src loading; playbackRate applies now.
  audio.preservesPitch = audio.webkitPreservesPitch = false;
  audio.defaultPlaybackRate = audio.playbackRate = e.rate;
  audio.loop = queue.length === 1;              // lone track just repeats
  audio.play();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: e.title, artist: `${e.t.artist} · ${e.bpm ?? '?'} spm`, album: `${label(playingBucket)} spm`,
      artwork: [{ src: 'icon.png', sizes: '512x512', type: 'image/png' }],
    });
  }
  rerender();
}

function next() {
  if (pos < 0) return;
  let i = pos + 1;
  while (i < queue.length && isNever(queue[i].t)) i++;   // marked never-play since the queue was built
  if (i < queue.length) return playAt(i);
  startBucket(playingBucket);                   // wrap around (reshuffles)
}
audio.onended = next;

function updateControls() {
  const here = playingBucket === viewBucket && pos >= 0;
  $('play').textContent = here && !audio.paused ? 'Pause' : 'Play';
  $('now').textContent = here ? `Now: ${queue[pos].title} · ${queue[pos].t.artist}` : '';
}

function updateMini() {
  const on = pos >= 0;
  $('mini').classList.toggle('hidden', !on);
  if (on) {
    $('miniPlay').textContent = audio.paused ? 'Play' : 'Pause';
    $('miniNow').textContent = `${label(playingBucket)} spm · ${queue[pos].title}`;
  }
  document.body.classList.toggle('has-mini', on);
}

$('play').onclick = () => {
  if (playingBucket !== viewBucket || pos < 0) return startBucket(viewBucket);
  audio.paused ? audio.play() : audio.pause();
};
for (const btn of $('modes').children) {
  btn.onclick = () => { mode = btn.dataset.mode; store.set('mode', mode); renderHome(); };
}
for (const btn of $('favModes').children) {
  btn.onclick = () => { favMode = btn.dataset.fav; store.set('favMode', favMode); renderHome(); };
}
$('miniPlay').onclick = () => { audio.paused ? audio.play() : audio.pause(); };
// Skip ahead 15 s; past the end the track ends and the next one starts.
const forward15 = () => { if (pos >= 0) audio.currentTime = Math.min(audio.currentTime + 15, audio.duration || Infinity); };
$('miniFwd').onclick = forward15;
$('miniNext').onclick = next;
$('miniNow').onclick = () => { if (playingBucket !== null) location.hash = `#/${playingBucket}`; };
$('shuffle').onclick = () => {
  shuffle = !shuffle;
  if (playingBucket === viewBucket && pos >= 0) {   // reorder what's left, keep current song
    const cur = queue[pos];
    queue = [cur, ...playOrder(inBucket(viewBucket)).filter(e => e.key !== cur.key)];
    pos = 0;
  }
  renderBucket();
};

audio.onplay = audio.onpause = () => { updateControls(); updateMini(); };
audio.ontimeupdate = () => { if (audio.duration) $('prog').value = audio.currentTime / audio.duration; };

// iOS 17+: declare this as music playback (not ambient sound) so the
// ring/silent switch doesn't mute it and it keeps going when locked.
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', next);
  try { navigator.mediaSession.setActionHandler('seekforward', forward15); } catch {}  // not every browser has it
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

Promise.all([
  fetch('tracks.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('api/marks', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
]).then(([data, m]) => {
  tracks = data;
  marks = m;
  addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
